{% extends "base.html" %}

{% block title %}Take Quiz - {{ topic }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="alert alert-success">
        <h4><i class="fas fa-question-circle"></i> Quiz: {{ topic }}</h4>
        <p class="mb-0">Difficulty: <span class="badge bg-{{ 'success' if difficulty == 'easy' else ('warning' if difficulty == 'medium' else 'danger') }}">{{ difficulty|upper }}</span></p>
    </div>

    <form method="POST" action="{{ url_for('submit_quiz') }}">
        <input type="hidden" name="topic" value="{{ topic }}">
        <input type="hidden" name="difficulty" value="{{ difficulty }}">
        
        {% for question in questions %}
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="mb-3">
                    <span class="badge bg-primary">Q{{ loop.index }}</span>
                    {{ question.question_text }}
                </h5>
                
                <input type="hidden" name="question_ids" value="{{ question.id }}">
                
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="answer_{{ question.id }}" value="A" id="q{{ question.id }}a" required>
                    <label class="form-check-label" for="q{{ question.id }}a">
                        A. {{ question.option_a }}
                    </label>
                </div>
                
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="answer_{{ question.id }}" value="B" id="q{{ question.id }}b" required>
                    <label class="form-check-label" for="q{{ question.id }}b">
                        B. {{ question.option_b }}
                    </label>
                </div>
                
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="answer_{{ question.id }}" value="C" id="q{{ question.id }}c" required>
                    <label class="form-check-label" for="q{{ question.id }}c">
                        C. {{ question.option_c }}
                    </label>
                </div>
                
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="answer_{{ question.id }}" value="D" id="q{{ question.id }}d" required>
                    <label class="form-check-label" for="q{{ question.id }}d">
                        D. {{ question.option_d }}
                    </label>
                </div>
            </div>
        </div>
        {% endfor %}

        <div class="text-center mb-4">
            <button type="submit" class="btn btn-primary btn-lg px-5">
                <i class="fas fa-check"></i> Submit Quiz
            </button>
            <a href="{{ url_for('student_dashboard') }}" class="btn btn-secondary btn-lg px-5">
                <i class="fas fa-times"></i> Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
